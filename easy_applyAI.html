
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>apply.ai — Job Application Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0a0e1a; font-family: 'DM Mono', 'Courier New', monospace; color: #e8eaf0; min-height: 100vh; }

    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.5s ease forwards; }

    .btn-primary { background: #00e5b0; color: #0a0e1a; border: none; padding: 12px 28px; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; transition: all 0.2s; letter-spacing: 0.05em; }
    .btn-primary:hover { background: #00ffca; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,176,0.3); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-sec { background: transparent; color: #00e5b0; border: 1px solid #00e5b033; padding: 10px 20px; font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .btn-sec:hover { border-color: #00e5b0; background: #00e5b011; }

    .copy-btn { background: #1a1f30; border: 1px solid #2a2f45; color: #888; font-size: 11px; font-family: 'DM Mono', monospace; padding: 5px 12px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
    .copy-btn:hover { color: #00e5b0; border-color: #00e5b044; }
    .copy-btn.copied { color: #00e5b0; border-color: #00e5b0; }

    .search-card { background: #111624; border: 1px solid #1e2438; border-radius: 10px; padding: 20px; margin-bottom: 14px; transition: border 0.2s; }
    .search-card:hover { border-color: #00e5b033; }

    .search-link { display: inline-flex; align-items: center; gap: 6px; background: #0d1120; border: 1px solid #1e2438; color: #ccd0e0; font-size: 11px; font-family: 'DM Mono', monospace; padding: 6px 12px; border-radius: 4px; transition: all 0.2s; text-decoration: none; margin: 4px 4px 4px 0; }
    .search-link:hover { border-color: #0a66c2; color: #60a5fa; }

    textarea { background: #111624; border: 1px solid #1e2438; border-radius: 8px; color: #e8eaf0; font-family: 'DM Mono', monospace; font-size: 13px; padding: 14px; width: 100%; box-sizing: border-box; resize: vertical; outline: none; transition: border 0.2s; }
    textarea:focus { border-color: #00e5b055; }

    .email-input { background: #0a0e1a; border: 1px solid #1e2438; border-radius: 6px; color: #e8eaf0; font-family: 'DM Mono', monospace; font-size: 13px; padding: 9px 14px; width: 100%; box-sizing: border-box; outline: none; transition: border 0.2s; }
    .email-input:focus { border-color: #00e5b055; }
    .email-input[readonly] { color: #00e5b0; cursor: default; }

    .upload-zone { border: 1px dashed #2a3050; border-radius: 10px; padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; background: #0d1020; }
    .upload-zone:hover { border-color: #00e5b066; }

    input[type=file] { display: none; }
    .tag { background: #00e5b011; color: #00e5b0; border: 1px solid #00e5b022; border-radius: 4px; padding: 2px 8px; font-size: 11px; display: inline-block; }
    .divider { height: 1px; background: #1e2438; margin: 32px 0; }
    .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

    .spinner { display: flex; gap: 6px; align-items: center; }
    .spinner-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e5b0; }
    .spinner-dot:nth-child(1) { animation: bounce 1.2s ease-in-out 0.0s infinite; }
    .spinner-dot:nth-child(2) { animation: bounce 1.2s ease-in-out 0.2s infinite; }
    .spinner-dot:nth-child(3) { animation: bounce 1.2s ease-in-out 0.4s infinite; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useRef, useCallback } = React;

  // ── Hardcoded API Key ──────────────────────────────────────────────────────
  const ANTHROPIC_API_KEY = "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";

  // ── Resume Data ────────────────────────────────────────────────────────────
  const RESUME_TEXT = `Pradeep | Melbourne VIC 3032, Australia | Mobile: +61 0422339141 | Email: pradeep23rk@gmail.com
LinkedIn: https://www.linkedin.com/in/pradeep-ragunathan-karunakaran-26476a271/

PERSONAL PROFILE
Backed by a Master's in Cyber Security and a strong IT support focus, I have hands-on experience troubleshooting operating systems, resolving user access issues, managing endpoint security, and working with core networking fundamentals. I have a solid foundation in Windows and Linux environments, Microsoft security tools, and incident handling through SOC simulations. As a customer-focused communicator with real-world frontline experience, I can translate technical issues into clear, practical solutions while adhering to ITIL-aligned processes.

CORE IT SUPPORT SKILLS
- Operating Systems: Windows 10/11, Linux (Ubuntu, Kali)
- SIEM Monitoring, Splunk SPL, Log Analysis & Correlation, Dashboard & Report Creation, Alert Triage & Investigation, Threat Detection, Incident Response, Threat Hunting, IOC Analysis, MITRE ATT&CK Mapping
- User & Access Management: Active Directory concepts, MFA, password resets, least-privilege access
- IT Support & Troubleshooting: Hardware/software issues, system configuration, log analysis
- Networking Fundamentals: TCP/IP, DNS, DHCP, VPN, CCNA-level knowledge
- Scripting & Automation: Python, PowerShell, Bash (basic automation & troubleshooting)
- Frameworks & Practices: ITIL fundamentals, ASD Essential Eight, NIST
- Soft Skills: Customer service, clear communication, documentation, teamwork

PROJECTS
SOC – Threat Detection & Incident Response
- Conducted end-to-end threat detection and incident investigations of simulated Conti ransomware using Splunk, correlating authentication, PowerShell, and Exchange Server logs.
- Identified and analysed Indicators of Compromise (IOC) including lateral movement, privilege escalation, and persistence, mapped to the MITRE ATT&CK framework.
- Performed phishing investigations using email header analysis, OSINT, domain reputation checks, and applied the Cyber Kill Chain methodology.
- Executed vulnerability management using Rapid7 InsightVM, identifying misconfigurations and outdated software, and prioritising risks using CVSS scoring and asset criticality.
- Developed and documented SOC playbooks, incident response workflows, and remediation actions including log tuning, email security hardening, and endpoint protection.

GRC – Governance, Risk & Compliance
- Performed risk assessments using ISO 27001 and NIST CSF, identifying security gaps and developing risk treatment and mitigation plans.
- Conducted ethical and governance Impact Assessments focusing on privacy, bias, accountability, and regulatory risk in emerging technologies.
- Reviewed data privacy, information security policies, and compliance controls within a simulated legal services environment and recommended governance improvements.
- Analysed IoT security risks in healthcare, including device security, data protection, and access control, proposing Secure Implementation and Risk Mitigation strategies using NIST Framework.

EDUCATION
- RMIT Master of Cyber Security, Melbourne
- Anna University Bachelor of Engineering in Computer Science

CERTIFICATIONS
- Splunk – Core Certified User
- ISC2 Certified in Cybersecurity (CC)
- TCM Practical Helpdesk
- ISC2 Continuous Monitoring and Incident Response for Zero Trust
- CCNA Routing and Switching: Introduction to Networking
- Certified Bug Hunter from Promt InfoTech

EXPERIENCE
Amazing Dino | Jun 2024 – Nov 2024 | Penetration Tester
- Vulnerability Assessment: Worked with a team of three on the Cyber Bay bug bounty platform to identify security vulnerabilities in live web applications.
- Report Writing with POC and CVE Documentation: Created comprehensive reports with proof of concept and CVE numbers to document identified vulnerabilities.

Infosys | Feb 2021 – Mar 2022 | Software Engineer
- Java Application Development: Developed and maintained Java applications, following the Spring development cycle.
- Spring Framework: Participated in the complete Spring development cycle, including dependency injection, aspect-oriented programming, and Spring MVC.

Coles | July 2023 – Present | Team Lead
- Customer Service: Provided exceptional customer service, answering queries, assisting with product selection, and resolving issues.
- Teamwork and Communication: Collaborated with team members to ensure efficient store operations.`;

  const LINKEDIN_TEMPLATE = `Hi [name], I hope you're doing well. I recently came across the [role] at [company] and noticed that you have worked there in [department/role] for the past years. I would really appreciate the opportunity to hear about your experience and any guidance you might have on applying for the role. While my background is more focused on cybersecurity, I have also worked in an IT environment as a developer at Infosys, where I regularly troubleshooted technical issues and supported applications. I am very interested in moving into [role] because I believe it will help me further develop my practical support skills while contributing to the team. I've attached my resume for your reference. If you feel my profile aligns with the role, I would greatly appreciate any advice or even a referral. Thank you for your time, and I look forward to connecting. Best regards, Pradeep`;

  const LINKEDIN_SEARCH_CATEGORIES = [
    { label: "IT Support / Helpdesk",    titleKeywords: ["IT Support", "Helpdesk", "Service Desk", "Desktop Support", "Technical Support"],              color: "#0a66c2" },
    { label: "Technology Analyst",        titleKeywords: ["Technology Analyst", "IT Analyst", "Systems Analyst", "Business Analyst IT", "Technical Analyst"], color: "#7c3aed" },
    { label: "Cybersecurity",             titleKeywords: ["Cyber Security", "SOC Analyst", "Security Analyst", "Information Security", "Cybersecurity Analyst"], color: "#dc2626" },
    { label: "IT Manager / Team Lead",    titleKeywords: ["IT Manager", "IT Lead", "Infrastructure Manager", "Technology Manager", "Head of IT"],          color: "#059669" },
    { label: "Talent / HR (Tech)",        titleKeywords: ["Talent Acquisition", "Technical Recruiter", "HR Technology", "Recruitment Specialist"],         color: "#d97706" },
  ];

  const MSG_KEY_MAP = ["it_support", "tech_analyst", "cyber", "it_manager", "hr_talent"];

  function buildLinkedInSearchUrl(company, titleKeyword) {
    const params = new URLSearchParams({ keywords: `"${titleKeyword}" "${company}"`, origin: "GLOBAL_SEARCH_HEADER" });
    return `https://www.linkedin.com/search/results/people/?${params.toString()}`;
  }

  // ── Claude API call ────────────────────────────────────────────────────────
  async function callClaude(messages, systemPrompt) {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages,
      }),
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${response.status}`);
    }
    const data = await response.json();
    return data.content.map((b) => b.text || "").join("");
  }

  // ── Spinner ────────────────────────────────────────────────────────────────
  function Spinner() {
    return (
      <div className="spinner">
        <div className="spinner-dot" />
        <div className="spinner-dot" />
        <div className="spinner-dot" />
      </div>
    );
  }

  // ── Section wrapper ────────────────────────────────────────────────────────
  function Section({ id, title, subtitle, badge, children }) {
    return (
      <div id={id} style={{ marginBottom: 48 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: "#fff" }}>{title}</div>
          {badge && (
            <span style={{ background: "#00e5b022", color: "#00e5b0", border: "1px solid #00e5b033", borderRadius: 4, padding: "2px 10px", fontSize: 11 }}>
              {badge}
            </span>
          )}
        </div>
        {subtitle && <div style={{ color: "#555", fontSize: 13, marginBottom: 20 }}>{subtitle}</div>}
        {children}
      </div>
    );
  }

  // ── Main App ───────────────────────────────────────────────────────────────
  function App() {
    const [jdText, setJdText]                     = useState("");
    const [jdFile, setJdFile]                     = useState(null);
    const [coverLetter, setCoverLetter]           = useState("");
    const [linkedinSearches, setLinkedinSearches] = useState([]);
    const [linkedinMessages, setLinkedinMessages] = useState({});
    const [loadingCL, setLoadingCL]               = useState(false);
    const [loadingLI, setLoadingLI]               = useState(false);
    const [loadingMsg, setLoadingMsg]             = useState("");
    const [companyName, setCompanyName]           = useState("");
    const [jobTitle, setJobTitle]                 = useState("");
    const [extraResume, setExtraResume]           = useState("");
    const [extraResumeText, setExtraResumeText]   = useState("");
    const [emailTo, setEmailTo]                   = useState("");
    const [emailFrom]                             = useState("pradeep23rk@gmail.com");
    const [emailSubject, setEmailSubject]         = useState("");
    const [copied, setCopied]                     = useState(null);

    const fileRef     = useRef();
    const resumeRef   = useRef();
    const coverRef    = useRef();
    const linkedinRef = useRef();

    const handleJDFile = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setJdFile(file.name);
      const reader = new FileReader();
      reader.onload = (ev) => setJdText(ev.target.result);
      reader.readAsText(file);
    };

    const handleExtraResume = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setExtraResume(file.name);
      const reader = new FileReader();
      reader.onload = (ev) => setExtraResumeText(ev.target.result);
      reader.readAsText(file);
    };

    const generateAll = useCallback(async () => {
      if (!jdText.trim()) return;
      setLoadingCL(true);
      setLoadingMsg("Analysing job description…");
      setCoverLetter("");
      setLinkedinSearches([]);
      setLinkedinMessages({});

      const combinedResume = RESUME_TEXT + (extraResumeText ? "\n\nSECOND RESUME:\n" + extraResumeText : "");

      try {
        // 1. Extract company + job title
        const meta = await callClaude(
          [{ role: "user", content: `From this job description, extract the company name and job title. Respond ONLY with JSON: {"company":"...","title":"..."}\n\n${jdText}` }],
          "You extract structured data from job descriptions. Return only valid JSON, no markdown."
        );
        let company = "the company", title = "this role";
        try {
          const parsed = JSON.parse(meta.replace(/```json|```/g, "").trim());
          company = parsed.company || company;
          title   = parsed.title   || title;
          setCompanyName(company);
          setJobTitle(title);
          setEmailSubject(`Application for ${title} – Pradeep Ragunathan Karunakaran`);
        } catch {}

        // 2. Cover letter
        setLoadingMsg("Writing tailored cover letter…");
        const cl = await callClaude(
          [{
            role: "user",
            content: `You are an expert career coach. Write a professional, tailored cover letter for the following job using the candidate's resume(s) as reference.\n\nJOB DESCRIPTION:\n${jdText}\n\nRESUME(S):\n${combinedResume}\n\nInstructions:\n- Address it "Dear Hiring Manager"\n- 3-4 paragraphs, professional but warm tone\n- Highlight the most relevant skills and experiences from the resume that match the JD\n- Show genuine enthusiasm for the specific role\n- End with a strong call to action\n- Sign off as Pradeep\n- Do NOT use generic filler phrases`,
          }],
          "You are an expert cover letter writer. Write compelling, specific cover letters that get interviews."
        );
        setCoverLetter(cl);
        setLoadingCL(false);
        setTimeout(() => coverRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 100);

        // 3. LinkedIn searches + messages
        setLoadingLI(true);
        setLoadingMsg("Generating LinkedIn outreach messages…");

        const searches = LINKEDIN_SEARCH_CATEGORIES.map((cat) => ({
          ...cat,
          urls: cat.titleKeywords.slice(0, 3).map((kw) => ({ keyword: kw, url: buildLinkedInSearchUrl(company, kw) })),
        }));
        setLinkedinSearches(searches);

        const msgResult = await callClaude(
          [{
            role: "user",
            content: `I'm applying for a ${title} role at ${company}. Generate one personalised LinkedIn connection message for each of the following contact types. Base each message on this template but adapt it naturally for each contact type: "${LINKEDIN_TEMPLATE.replace(/\[role\]/g, title).replace(/\[company\]/g, company)}"

Contact types:
1. IT Support / Helpdesk peer
2. Technology Analyst peer
3. Cybersecurity professional
4. IT Manager / Team Lead
5. Talent / HR recruiter (tech roles)

Respond ONLY with a JSON object with keys: "it_support", "tech_analyst", "cyber", "it_manager", "hr_talent". Each value is the message string. No markdown.`,
          }],
          "You write personalised LinkedIn outreach messages. Return only valid JSON, no markdown."
        );

        try {
          const msgs = JSON.parse(msgResult.replace(/```json|```/g, "").trim());
          setLinkedinMessages(msgs);
        } catch { setLinkedinMessages({}); }

        setLoadingLI(false);
        setTimeout(() => linkedinRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 200);

      } catch (err) {
        setCoverLetter(`Error: ${err.message || "Something went wrong. Please try again."}`);
        setLoadingCL(false);
        setLoadingLI(false);
      }
    }, [jdText, extraResumeText]);

    const copyText = (text, key) => {
      navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(null), 2000);
    };

    const todayStr = new Date().toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });

    return (
      <div style={{ minHeight: "100vh", background: "#0a0e1a", fontFamily: "'DM Mono', 'Courier New', monospace", color: "#e8eaf0" }}>

        {/* ── Sticky Header ── */}
        <div style={{ borderBottom: "1px solid #1e2438", padding: "20px 32px", position: "sticky", top: 0, background: "#0a0e1a", zIndex: 100 }}>
          <div style={{ maxWidth: 800, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, color: "#00e5b0", letterSpacing: "-0.02em" }}>apply.ai</div>
              <div style={{ fontSize: 11, color: "#444", marginTop: 2 }}>job application workflow</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-sec" style={{ fontSize: 11, padding: "6px 14px" }} onClick={() => document.getElementById("jd-section").scrollIntoView({ behavior: "smooth" })}>① JD</button>
              {coverLetter && <button className="btn-sec" style={{ fontSize: 11, padding: "6px 14px" }} onClick={() => coverRef.current?.scrollIntoView({ behavior: "smooth" })}>② Cover Letter</button>}
              {linkedinSearches.length > 0 && <button className="btn-sec" style={{ fontSize: 11, padding: "6px 14px" }} onClick={() => linkedinRef.current?.scrollIntoView({ behavior: "smooth" })}>③ LinkedIn</button>}
            </div>
          </div>
        </div>

        {/* ── Page Content ── */}
        <div style={{ maxWidth: 800, margin: "0 auto", padding: "32px 32px 80px" }}>

          {/* SECTION 1 — Job Description */}
          <div id="jd-section">
            <Section title="Upload Job Description" subtitle="Your resume is pre-loaded. Add the JD for any role you're applying to.">

              {/* Loaded Resumes */}
              <div style={{ background: "#0d1020", border: "1px solid #1e2438", borderRadius: 10, padding: 16, marginBottom: 24 }}>
                <div style={{ fontSize: 11, color: "#444", marginBottom: 12, letterSpacing: "0.08em" }}>LOADED RESUMES</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: extraResume ? 10 : 0 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#00e5b0", flexShrink: 0 }} />
                  <span style={{ fontSize: 13 }}>Resume.docx</span>
                  <span className="tag">Primary</span>
                </div>
                {extraResume && (
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#00e5b0", flexShrink: 0 }} />
                    <span style={{ fontSize: 13 }}>{extraResume}</span>
                    <span className="tag">Secondary</span>
                  </div>
                )}
                <div style={{ marginTop: 14 }}>
                  <input type="file" ref={resumeRef} accept=".txt,.docx" onChange={handleExtraResume} />
                  <button className="btn-sec" onClick={() => resumeRef.current.click()}>+ Add second resume</button>
                </div>
              </div>

              {/* JD Upload zone */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: "#666", marginBottom: 10, letterSpacing: "0.05em" }}>JOB DESCRIPTION</div>
                <div className="upload-zone" onClick={() => fileRef.current.click()}>
                  <input type="file" ref={fileRef} accept=".txt,.pdf,.docx" onChange={handleJDFile} />
                  <div style={{ fontSize: 28, marginBottom: 8 }}>📄</div>
                  <div style={{ fontSize: 13, color: "#888" }}>
                    {jdFile ? <span style={{ color: "#00e5b0" }}>✓ {jdFile}</span> : "Click to upload job description"}
                  </div>
                  <div style={{ fontSize: 11, color: "#444", marginTop: 4 }}>TXT, PDF, DOCX</div>
                </div>
              </div>

              <div style={{ textAlign: "center", color: "#444", fontSize: 12, margin: "12px 0" }}>— or paste directly —</div>

              <textarea
                rows={10}
                placeholder="Paste the full job description here…"
                value={jdText}
                onChange={(e) => setJdText(e.target.value)}
              />

              <div style={{ marginTop: 20, display: "flex", justifyContent: "flex-end" }}>
                <button className="btn-primary" disabled={!jdText.trim() || loadingCL || loadingLI} onClick={generateAll}>
                  {loadingCL
                    ? <span style={{ display: "flex", alignItems: "center", gap: 10 }}><Spinner />{loadingMsg}</span>
                    : "Generate Cover Letter + LinkedIn →"}
                </button>
              </div>
            </Section>
          </div>

          {/* SECTION 2 — Cover Letter */}
          {(loadingCL || coverLetter) && (
            <div ref={coverRef} className="fade-in">
              <div className="divider" />
              <Section
                title="Cover Letter"
                subtitle={jobTitle && companyName ? `${jobTitle} at ${companyName}` : "Tailored to your resume"}
                badge={coverLetter ? "Ready" : null}
              >
                {/* Email fields */}
                <div style={{ background: "#111624", border: "1px solid #1e2438", borderRadius: 10, padding: 20, marginBottom: 16 }}>
                  <div style={{ fontSize: 11, color: "#444", marginBottom: 14, letterSpacing: "0.08em" }}>EMAIL DETAILS</div>
                  {[
                    { label: "FROM",    value: emailFrom,    readOnly: true,  setter: null,            placeholder: "" },
                    { label: "TO",      value: emailTo,      readOnly: false, setter: setEmailTo,       placeholder: "hiring@company.com" },
                    { label: "DATE",    value: todayStr,     readOnly: true,  setter: null,            placeholder: "" },
                    { label: "SUBJECT", value: emailSubject, readOnly: false, setter: setEmailSubject,  placeholder: "Application for [Role] – Pradeep" },
                  ].map(({ label, value, readOnly, setter, placeholder }) => (
                    <div key={label} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
                      <div style={{ fontSize: 11, color: "#555", width: 60, flexShrink: 0, letterSpacing: "0.06em" }}>{label}</div>
                      <input
                        className="email-input"
                        value={value}
                        readOnly={readOnly}
                        placeholder={placeholder}
                        onChange={setter ? (e) => setter(e.target.value) : undefined}
                      />
                    </div>
                  ))}
                </div>

                {/* Cover letter body */}
                <div style={{ background: "#111624", border: "1px solid #1e2438", borderRadius: 10, padding: 28, lineHeight: 1.8, fontSize: 14, color: "#ccd0e0", whiteSpace: "pre-wrap", marginBottom: 16 }}>
                  {loadingCL
                    ? <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "40px 0" }}>
                        <Spinner />
                        <div style={{ color: "#555", fontSize: 12 }}>{loadingMsg}</div>
                      </div>
                    : coverLetter}
                </div>

                {coverLetter && (
                  <div style={{ display: "flex", justifyContent: "flex-end" }}>
                    <button
                      className={`copy-btn ${copied === "cover" ? "copied" : ""}`}
                      onClick={() => copyText(`From: ${emailFrom}\nTo: ${emailTo || "[hiring email]"}\nDate: ${todayStr}\nSubject: ${emailSubject}\n\n${coverLetter}`, "cover")}
                    >
                      {copied === "cover" ? "✓ Copied!" : "Copy full email"}
                    </button>
                  </div>
                )}
              </Section>
            </div>
          )}

          {/* SECTION 3 — LinkedIn */}
          {(loadingLI || linkedinSearches.length > 0) && (
            <div ref={linkedinRef} className="fade-in">
              <div className="divider" />
              <Section
                title="LinkedIn Connections"
                subtitle={`Find real people at ${companyName || "the company"} in IT Support, Technology Analyst, and Cyber roles`}
                badge={linkedinSearches.length > 0 ? `${LINKEDIN_SEARCH_CATEGORIES.length} categories` : null}
              >
                {loadingLI && linkedinSearches.length === 0 ? (
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "60px 0" }}>
                    <Spinner />
                    <div style={{ color: "#555", fontSize: 12 }}>{loadingMsg}</div>
                  </div>
                ) : (
                  <>
                    <div style={{ background: "#0d1120", border: "1px solid #1e2438", borderRadius: 8, padding: "12px 16px", marginBottom: 20, fontSize: 12, color: "#666", lineHeight: 1.7 }}>
                      💡 These are <strong style={{ color: "#ccd0e0" }}>real LinkedIn search links</strong> — click any to open a live search for people at <strong style={{ color: "#00e5b0" }}>{companyName}</strong> in that role. Copy the tailored message and send it when you connect.
                    </div>

                    {linkedinSearches.map((cat, ci) => {
                      const msgKey = MSG_KEY_MAP[ci];
                      const msg = linkedinMessages[msgKey];
                      return (
                        <div key={ci} className="search-card fade-in">
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
                            <div style={{ display: "flex", alignItems: "center" }}>
                              <span className="cat-dot" style={{ background: cat.color }} />
                              <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: "#fff" }}>{cat.label}</span>
                            </div>
                            {msg && (
                              <button
                                className={`copy-btn ${copied === `msg-${ci}` ? "copied" : ""}`}
                                onClick={() => copyText(msg, `msg-${ci}`)}
                              >
                                {copied === `msg-${ci}` ? "✓ Copied!" : "Copy message"}
                              </button>
                            )}
                          </div>

                          <div style={{ marginBottom: 14 }}>
                            <div style={{ fontSize: 11, color: "#444", marginBottom: 8, letterSpacing: "0.06em" }}>SEARCH LINKS — opens LinkedIn with real people</div>
                            <div style={{ display: "flex", flexWrap: "wrap" }}>
                              {cat.urls.map((u, ui) => (
                                <a key={ui} href={u.url} target="_blank" rel="noreferrer" className="search-link">
                                  🔍 {u.keyword} at {companyName} →
                                </a>
                              ))}
                            </div>
                          </div>

                          <div style={{ background: "#0a0e1a", borderRadius: 6, padding: 12 }}>
                            <div style={{ fontSize: 11, color: "#444", marginBottom: 6, letterSpacing: "0.06em" }}>TAILORED MESSAGE</div>
                            {loadingLI && !msg
                              ? <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#555", fontSize: 12 }}><Spinner /> Generating…</div>
                              : <div style={{ fontSize: 12, color: "#ccd0e0", lineHeight: 1.7 }}>{msg || "Message will appear here once generated."}</div>
                            }
                          </div>
                        </div>
                      );
                    })}

                    <div style={{ marginTop: 20, padding: 16, background: "#0d1020", borderRadius: 8, border: "1px solid #1e2438" }}>
                      <div style={{ fontSize: 11, color: "#444", marginBottom: 8 }}>⚠️ HOW TO USE</div>
                      <div style={{ fontSize: 12, color: "#666", lineHeight: 1.7 }}>
                        1. Click a search link → it opens LinkedIn showing <em>real people</em> in that role at {companyName}.<br />
                        2. Copy the tailored message above.<br />
                        3. Click Connect on any relevant profile and paste the message. LinkedIn does not allow automated requests — this keeps your account safe.
                      </div>
                    </div>
                  </>
                )}
              </Section>
            </div>
          )}

          {/* Reset button */}
          {(coverLetter || linkedinSearches.length > 0) && (
            <div style={{ display: "flex", justifyContent: "center", marginTop: 40 }}>
              <button className="btn-sec" onClick={() => {
                setJdText(""); setJdFile(null); setCoverLetter(""); setLinkedinSearches([]);
                setLinkedinMessages({}); setCompanyName(""); setJobTitle("");
                setEmailTo(""); setEmailSubject("");
                document.getElementById("jd-section").scrollIntoView({ behavior: "smooth" });
              }}>
                + New Application
              </button>
            </div>
          )}

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
